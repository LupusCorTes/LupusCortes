<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<title>Service Request</title>
<style>
  :root{
    --bg:#ffffff; --side:#eceef1; --side-hover:#dde0e5; --side-active:#ffffff;
    --text:#1f2328; --muted:#6b7280; --accent:#3b82f6; --border:#e3e5e8; --side-w:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

  /* ===== AUTH ===== */
  .auth{position:fixed;inset:0;background:#fff;overflow-y:auto;display:flex;padding:24px 16px;z-index:50}
  .auth-card{width:100%;max-width:400px;margin:auto;animation:fadeUp .5s ease}
  .auth-logo{width:60px;height:60px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 10px;animation:pop .6s ease}
  .auth h1{text-align:center;font-size:22px}
  .auth p.sub{text-align:center;color:var(--muted);font-size:13.5px;margin-top:4px}
  .tabs{display:flex;background:var(--side);border-radius:12px;padding:4px;margin:18px 0 14px}
  .tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:14px;cursor:pointer;transition:all .25s}
  .tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);color:var(--accent);font-weight:600}
  .seg{display:flex;gap:8px;margin-bottom:10px}
  .seg button{flex:1;border:1px solid var(--border);background:#fff;padding:11px;border-radius:10px;cursor:pointer;font-size:14px;transition:all .2s}
  .seg button.on{border-color:var(--accent);background:#eff6ff;color:var(--accent);font-weight:600;transform:scale(1.02)}
  label.l{display:block;font-size:12.5px;color:var(--muted);margin:4px 0}
  .pw{position:relative}
  .pw .field{padding-right:42px}
  .pw button{position:absolute;right:6px;top:5px;border:none;background:transparent;cursor:pointer;font-size:17px;padding:4px 6px}
  .err{color:#dc2626;font-size:13px;min-height:18px;margin:6px 0}
  .note{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
  .btn.full{width:100%;padding:12px;font-size:15px}

  /* ===== APP LAYOUT ===== */
  #app{display:flex;width:100%;height:100vh;height:100dvh}

  .sidebar{
    width:var(--side-w);background:var(--side);height:100%;display:flex;flex-direction:column;
    border-right:1px solid var(--border);transition:transform .35s cubic-bezier(.4,0,.2,1);
    z-index:20;flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:700;font-size:17px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;animation:pop .6s ease}
  .menu{flex:1;overflow-y:auto;padding:6px 10px 12px}
  .menu::-webkit-scrollbar{width:4px}
  .menu::-webkit-scrollbar-thumb{background:#c5c9cf;border-radius:4px}
  .item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;margin:2px 0;border-radius:10px;cursor:pointer;
    font-size:14.5px;color:#374151;position:relative;opacity:0;transform:translateX(-20px);
    animation:slideIn .45s ease forwards;transition:background .2s,transform .2s,color .2s;user-select:none;
  }
  .item .ic{font-size:18px;width:24px;text-align:center;transition:transform .25s}
  .item:hover{background:var(--side-hover);transform:translateX(4px)}
  .item:hover .ic{transform:scale(1.2) rotate(-6deg)}
  .item.active{background:var(--side-active);color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .item.active::before{content:"";position:absolute;left:-10px;top:20%;height:60%;width:4px;border-radius:0 4px 4px 0;background:var(--accent);animation:grow .3s ease}
  .item .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px;display:none}
  .item .badge.show{display:inline-block;animation:pop .3s}
  .side-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

  @keyframes slideIn{to{opacity:1;transform:translateX(0)}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

  .main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;background:var(--bg)}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
  .topbar h1{font-size:18px;font-weight:600}
  .status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .burger{display:none;border:none;background:var(--side);width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer}
  .view{flex:1;min-height:0;overflow-y:auto;padding:20px;animation:fadeUp .35s ease}
  .view.chatmode{overflow:hidden;display:flex;flex-direction:column;padding:12px 14px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:15}

  .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;display:inline-block;flex-shrink:0}
  .dot.off{background:#f59e0b}

  /* ===== CHAT ===== */
  .chat-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
  .msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 4px 10px}
  .msg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;animation:fadeUp .3s ease;position:relative;word-break:break-word}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.ot{align-self:flex-start;background:var(--side);border-bottom-left-radius:4px}
  .msg.me a{color:#fff}
  .msg small{display:block;opacity:.65;font-size:11px;margin-top:4px}
  .who{font-size:12px;font-weight:600;margin-bottom:3px;color:#4b5563}
  .gm{color:#3b82f6}.gf{color:#ec4899}
  .msg .star{position:absolute;top:-8px;right:-8px;background:#fff;border:1px solid var(--border);border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:grid;place-items:center;opacity:.0;transition:opacity .2s}
  .msg:hover .star,.msg .star:focus{opacity:1}
  @media(hover:none){.msg .star{opacity:.85}}
  .chatimg{display:block;max-width:100%;max-height:240px;border-radius:10px;margin-top:4px}
  a.fl{display:inline-block;text-decoration:none;color:inherit;font-size:14px}
  a.fl span{opacity:.7;font-size:12px}
  .typing{min-height:28px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:2px 4px}
  .dots{display:inline-flex;gap:3px;background:var(--side);padding:7px 10px;border-radius:12px;animation:fadeUp .25s ease}
  .dots i{width:6px;height:6px;border-radius:50%;background:#9aa1ab;animation:bounce 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  .composer{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:14px;padding:8px;background:#fff}
  .composer input[type=text]{flex:1;min-width:0;border:none;outline:none;font-size:15px;padding:8px;background:transparent}

  .btn{border:none;cursor:pointer;border-radius:10px;padding:9px 14px;font-size:14px;background:var(--accent);color:#fff;transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.94)}
  .btn:disabled{opacity:.6}
  .btn.ghost{background:var(--side);color:var(--text)}
  .btn.danger{background:#ef4444}

  /* ===== LIST / CARD ===== */
  .list{display:flex;flex-direction:column;gap:8px}
  .card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;animation:fadeUp .3s ease;transition:box-shadow .2s,transform .2s}
  .card:hover{box-shadow:0 3px 10px rgba(0,0,0,.07);transform:translateY(-2px)}
  .card .info{flex:1;min-width:0}
  .card .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .info span{font-size:12px;color:var(--muted)}
  .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--side);flex-shrink:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .grid a{display:block;animation:fadeUp .3s ease}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
  .grid span{font-size:11px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);margin-top:60px;font-size:14px}
  .empty .big{font-size:48px;margin-bottom:8px}
  .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}
  .av.m{background:#3b82f6}.av.f{background:#ec4899}
  .av.big{width:80px;height:80px;font-size:32px;margin:0 auto 10px}

  .drop{border:2px dashed #c5c9cf;border-radius:16px;padding:40px 16px;text-align:center;cursor:pointer;transition:all .25s}
  .drop:hover,.drop.over{border-color:var(--accent);background:#eff6ff;transform:scale(1.01)}
  .drop .big{font-size:44px}
  .progress{height:6px;background:var(--side);border-radius:6px;overflow:hidden;margin-top:6px}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  h2{font-size:16px;margin:16px 0 8px}
  input.search,select.field,.field{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14.5px;outline:none;margin-bottom:10px;background:#fff;font-family:inherit}
  .field:focus,input.search:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
  details{border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
  summary{cursor:pointer;font-weight:600;font-size:14px}
  details p{margin-top:8px;font-size:13.5px;color:var(--muted)}
  .profile{text-align:center;max-width:360px;margin:10px auto}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;animation:fadeUp .3s ease;max-width:90%}

  @media(max-width:760px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.15)}
    body.open .sidebar{transform:translateX(0)}
    body.open .overlay{opacity:1;pointer-events:auto}
    .burger{display:block}
    .msg{max-width:90%}
  }
  .hero{text-align:center;max-width:440px;margin:70px auto 0;color:#374151}
  .hero .big{font-size:56px}
  .hero h2{font-size:21px;margin:10px 0 6px;color:var(--text)}
  .hero p{color:var(--muted);font-size:15px;line-height:1.55}
  .hero .dots{display:inline-flex}
  .chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--side);color:#4b5563}
  .chip.ok{background:#dcfce7;color:#166534}
  .chip.no{background:#fee2e2;color:#991b1b}
  .btn.ok{background:#16a34a}
  .req-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .req-actions .btn{padding:7px 12px;font-size:13px}
  .dot.gray{background:#c5c9cf}
  .av.adm{background:#1f2937}
  .msg.ai{align-self:flex-start;background:#eef4ff;border:1px solid #cfe0ff;border-bottom-left-radius:4px}
  .who .chip{margin-left:6px}
  .aibar{display:flex;align-items:center;gap:10px;padding:2px 2px 8px;min-height:36px}
  .aibtn{border:1px solid #cfe0ff;background:#eef4ff;color:#1d4ed8;border-radius:20px;padding:6px 14px;font-size:13.5px;cursor:pointer;font-weight:600;transition:all .2s}
  .aibtn.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
  .aibar .hint{font-size:12px;color:var(--muted)}
  #who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<!-- ===== LOGIN (REQUEST) ===== -->
<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-logo">🛎️</div>
    <h1>Service Request</h1>
    <p class="sub">Masukkan username untuk mengirim request</p>
    <form id="fReq" autocomplete="off" style="margin-top:20px">
      <label class="l">Username</label>
      <input class="field" id="uName" maxlength="20" placeholder="3-20 karakter (huruf, angka, _)" autocapitalize="off">
      <label class="l">Kode Admin <span style="opacity:.7">(opsional)</span></label>
      <div class="pw"><input class="field" id="uCode" type="password" maxlength="64" placeholder="Kosongkan jika pengguna biasa"><button type="button" class="eye">👁️</button></div>
      <div class="err" id="errReq"></div>
      <button class="btn full" type="submit">Request</button>
    </form>
  </div>
</div>

<!-- ===== APLIKASI ===== -->
<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">🛎️</div><span>Service Request</span></div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot"><span class="dot"></span><span id="who">-</span><button class="btn ghost" id="logout" type="button" style="margin-left:auto;padding:5px 10px;font-size:12px">Keluar</button></div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <section class="main">
    <header class="topbar">
      <button class="burger" id="burger">☰</button>
      <h1 id="title">Dashboard</h1>
      <div class="status"><span class="dot off" id="sdot"></span><span id="stext">Menghubungkan...</span></div>
    </header>
    <div class="view" id="view"></div>
  </section>
</div>

<script type="module">
/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtText = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const fmtTime = t => {
  if(!t) return '';
  const d = new Date(t), n = new Date();
  const hm = d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  return d.toDateString()===n.toDateString() ? hm : d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+' '+hm;
};
const empty = (i,t) => `<div class="empty"><div class="big">${i}</div>${t}</div>`;
function toast(t){
  const d = document.createElement('div'); d.className='toast'; d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
}
function showSetup(title, msg){
  document.body.innerHTML = `<div style="padding:28px;font-family:system-ui,sans-serif;max-width:520px;margin:auto;line-height:1.55"><h2>${title}</h2><p style="margin-top:8px;color:#555">${msg}</p></div>`;
  document.body.style.overflow = 'auto';
}

/* ---- suara klik saat interaksi (diatur di menu Setting) ---- */
let actx = null;
function clickSound(){
  if(ls.get('sr_click') === '0') return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = 900; g.gain.value = .03;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.0001, t + .05);
    o.start(t); o.stop(t + .06);
  }catch(e){}
}
document.addEventListener('pointerdown', e => {
  if(e.target.closest && e.target.closest('button,.item,summary,input[type=checkbox],.aibtn')) clickSound();
}, true);

/* ================= FIREBASE ================= */
const FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
let cfg = null;
try { cfg = (await import('./config.js')).default; } catch(e) {}
const bad = v => !v || String(v).includes('ISI_');
if(!cfg || bad(cfg.apiKey) || bad(cfg.databaseURL)){
  showSetup('Firebase belum diatur','Isi file <b>config.js</b> dengan konfigurasi proyek Firebase kamu, lalu muat ulang halaman.');
  throw new Error('config belum diisi');
}
let A, D, auth, db;
try{
  const [app_, au, dbm] = await Promise.all([import(FB+'firebase-app.js'), import(FB+'firebase-auth.js'), import(FB+'firebase-database.js')]);
  A = au; D = dbm;
  const app = app_.initializeApp(cfg);
  auth = A.getAuth(app); db = D.getDatabase(app);
}catch(e){
  showSetup('Gagal memuat Firebase','Cek koneksi internet kamu lalu muat ulang halaman.');
  throw e;
}
const { ref, set, get, update, remove, push, query, orderByChild, limitToLast, onValue, onChildAdded, onDisconnect, serverTimestamp } = D;

const fbMsg = e => {
  const c = e && e.code, m = String((e && e.message) || '');
  if(c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation')
    return 'Login Anonymous belum diaktifkan di Firebase (Authentication > Sign-in method > Anonymous).';
  if(c === 'auth/network-request-failed') return 'Koneksi internet bermasalah.';
  if(c === 'auth/too-many-requests') return 'Terlalu banyak percobaan, coba lagi nanti.';
  if(c === 'PERMISSION_DENIED' || m.includes('PERMISSION_DENIED')) return 'Ditolak oleh aturan database. Pastikan Rules terbaru sudah di-Publish.';
  return 'Terjadi kesalahan: ' + (c || m || 'tidak diketahui');
};

let me = null, current = 'dash', unread = 0, entered = false, busy = false, ready = false, chatStarted = false;
let myReq = null, aiMode = false, sendingChat = false;
const state = { online:[], requests:[], msgs:[], aiBusy:[] };
const view = $('#view');

/* ================= AI (lewat Cloudflare Worker, kunci tidak ada di sini) ================= */
async function askAI(messages){
  if(bad(cfg.aiUrl)) throw new Error('AI belum diaktifkan. Tambahkan aiUrl di config.js (lihat panduan).');
  const idToken = await auth.currentUser.getIdToken();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 40000);
  try{
    const r = await fetch(cfg.aiUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ idToken, messages }), signal:ctl.signal });
    let d = {}; try{ d = await r.json(); }catch(e){}
    if(!r.ok) throw new Error(d.error || ('AI error (' + r.status + ')'));
    return String(d.reply || '').trim() || 'AI tidak memberi jawaban.';
  }catch(e){
    if(e.name === 'AbortError') throw new Error('AI terlalu lama menjawab, coba lagi.');
    if(e instanceof TypeError) throw new Error('Tidak bisa menghubungi AI. Cek koneksi atau alamat aiUrl.');
    throw e;
  }finally{ clearTimeout(timer); }
}

/* ================= LOGIN (REQUEST) ================= */
document.querySelectorAll('.eye').forEach(b => b.onclick = () => {
  const i = b.previousElementSibling; i.type = i.type==='password' ? 'text' : 'password';
});

$('#fReq').onsubmit = async e => {
  e.preventDefault();
  const err = $('#errReq'); err.textContent = '';
  const name = $('#uName').value.trim(), code = $('#uCode').value.trim();
  if(!/^[A-Za-z0-9_]{3,20}$/.test(name)) return err.textContent = 'Username 3-20 karakter: huruf, angka, atau _';
  const btn = e.submitter; if(btn) btn.disabled = true;
  busy = true;
  try{
    if(!auth.currentUser) await A.signInAnonymously(auth);
    const uid = auth.currentUser.uid;
    await set(ref(db,'names/'+uid), name);
    if(code){
      try{ await set(ref(db,'adminClaims/'+uid), code); }
      catch(ex){ throw { message:'Kode admin salah.' }; }
      ls.set('sr_name_'+uid, name);
      enterApp('admin', name);
    }else{
      await set(ref(db,'requests/'+uid), { username:name, status:'pending', time:serverTimestamp() });
      enterApp('user', name);
    }
  }catch(ex){ err.textContent = ex.message && !ex.code ? ex.message : fbMsg(ex); }
  busy = false; if(btn) btn.disabled = false;
};

A.onAuthStateChanged(auth, async u => {
  if(busy) return;
  if(!u){ if(entered) location.reload(); else $('#auth').hidden = false; return; }
  if(entered) return;
  try{
    const c = await get(ref(db,'adminClaims/'+u.uid));
    if(c.exists()){ enterApp('admin', ls.get('sr_name_'+u.uid) || 'Admin'); return; }
    const r = await get(ref(db,'requests/'+u.uid));
    if(r.exists()){ enterApp('user', r.val().username); return; }
  }catch(e){}
  $('#auth').hidden = false;
});

function logout(){
  const jobs = [];
  try{
    jobs.push(remove(ref(db,'presence/'+me.uid)), remove(ref(db,'aiBusy/'+me.uid)));
    if(me.role === 'admin') jobs.push(remove(ref(db,'adminClaims/'+me.uid)));
    else jobs.push(remove(ref(db,'requests/'+me.uid)));
  }catch(e){}
  Promise.allSettled(jobs).finally(() => A.signOut(auth).catch(()=>{}).finally(() => location.reload()));
}
$('#logout').onclick = logout;

/* ================= MENU ================= */
const M = {
  dash:{ic:'🏠',t:'Dashboard'}, inbox:{ic:'📥',t:'Pesan Masuk'}, chat:{ic:'💬',t:'Chat'}, help:{ic:'✨',t:'Help'},
  about:{ic:'ℹ️',t:'About'}, settings:{ic:'⚙️',t:'Setting'}, online:{ic:'🟢',t:'Pengguna Online'}
};
const ORDER_USER  = ['dash','chat','help','about','settings','online'];
const ORDER_ADMIN = ['dash','inbox','chat','help','about','settings','online'];
let menuIds = [];

function buildMenu(){
  const m = $('#menu'); m.innerHTML = '';
  menuIds = me.role === 'admin' ? ORDER_ADMIN : ORDER_USER;
  menuIds.forEach((id,i)=>{
    const d = document.createElement('div');
    d.className = 'item'; d.dataset.id = id; d.style.animationDelay = (i*60)+'ms';
    d.innerHTML = `<span class="ic">${M[id].ic}</span><span>${M[id].t}</span><span class="badge" id="b-${id}"></span>`;
    d.onclick = () => go(id);
    m.appendChild(d);
  });
}
function badges(){
  const set_ = (id,n) => { const b = $('#b-'+id); if(!b) return; b.textContent = n; b.classList.toggle('show', n>0); };
  set_('inbox', state.requests.filter(r => r.status==='pending').length);
  set_('chat', unread);
  set_('online', state.online.length);
}
function go(id){
  current = id;
  if(id === 'chat'){ unread = 0; badges(); }
  document.querySelectorAll('.item').forEach(e => e.classList.toggle('active', e.dataset.id===id));
  $('#title').textContent = M[id].t;
  document.body.classList.remove('open');
  render();
}
function render(){
  view.classList.toggle('chatmode', current==='chat' || current==='help');
  view.style.animation='none'; void view.offsetWidth; view.style.animation='';
  V[current]();
}

const canChat = () => !!me && (me.role === 'admin' || (myReq && myReq.status === 'accepted'));

/* ================= MASUK APLIKASI ================= */
function enterApp(role, username){
  if(entered) return;
  entered = true;
  me = { uid:auth.currentUser.uid, username, role };
  $('#auth').hidden = true; $('#app').hidden = false;
  $('#who').textContent = username + ' · ' + (role==='admin' ? 'Admin' : 'Pengguna');
  buildMenu();
  connect();
  go('dash');
}

function setStatus(ok){
  $('#sdot').classList.toggle('off', !ok);
  $('#stext').textContent = ok ? 'Terhubung' : 'Menghubungkan...';
}

function connect(){
  const myPres = ref(db,'presence/'+me.uid);
  onValue(ref(db,'.info/connected'), snap => {
    const ok = snap.val() === true; setStatus(ok);
    if(ok){
      onDisconnect(myPres).remove()
        .then(() => set(myPres, { username:me.username, role:me.role }))
        .catch(()=>{});
    }
  });
  onValue(ref(db,'presence'), s => {
    const v = s.val() || {};
    state.online = Object.entries(v).map(([uid,x]) => ({ id:uid, ...x }));
    badges(); if(current==='online' || current==='inbox') render();
  });

  if(me.role === 'admin'){
    const q = query(ref(db,'requests'), orderByChild('time'), limitToLast(100));
    onValue(q, s => {
      const arr = [];
      s.forEach(c => { arr.push({ uid:c.key, ...c.val() }); });
      arr.sort((a,b) => (b.time||0) - (a.time||0));
      state.requests = arr; badges();
      if(current === 'inbox') render();
    });
    startChat();
  }else{
    onValue(ref(db,'requests/'+me.uid), s => {
      myReq = s.val();
      if(canChat()) startChat();
      if(current === 'dash' || current === 'chat') render();
    });
  }
}

/* ================= CHAT ================= */
let drawQueued = false, forceScroll = false, lastSend = 0;
function startChat(){
  if(chatStarted) return;
  chatStarted = true;
  const q = query(ref(db,'messages'), limitToLast(100));
  onChildAdded(q, snap => {
    const m = { id:snap.key, ...snap.val() };
    if(state.msgs.some(x => x.id === m.id)) return;
    state.msgs.push(m);
    if(state.msgs.length > 300) state.msgs.shift();
    const mine = m.uid === me.uid || m.by === me.uid;
    if(ready && !mine && current !== 'chat'){ unread++; badges(); }
    if(current === 'chat') scheduleDraw(mine);
  }, () => { chatStarted = false; });
  onValue(q, () => { ready = true; if(current==='chat') scheduleDraw(true); }, { onlyOnce:true });
  onValue(ref(db,'aiBusy'), s => {
    const v = s.val() || {};
    state.aiBusy = Object.values(v).map(x => x.username);
    drawTyping();
  });
}
function scheduleDraw(force){
  forceScroll = forceScroll || !!force;
  if(drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; drawMsgs(forceScroll); forceScroll = false; });
}
function msgHTML(m){
  const ai = m.role === 'ai', mine = !ai && m.uid === me.uid;
  let who = '';
  if(ai) who = `<div class="who"><span>✨ AI</span></div>`;
  else if(!mine) who = `<div class="who"><span>${esc(m.username)}</span>${m.role==='admin' ? '<b class="chip ok">Admin</b>' : ''}</div>`;
  return `<div class="msg ${ai?'ai':mine?'me':'ot'}">${who}<div>${fmtText(m.text)}</div><small>${fmtTime(m.time)}</small></div>`;
}
function drawMsgs(force){
  const box = $('#msgs'); if(!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.innerHTML = state.msgs.length ? state.msgs.map(msgHTML).join('') : empty('💬','Belum ada pesan.<br>Mulai percakapan!');
  if(force || near) box.scrollTop = box.scrollHeight;
}
function drawTyping(){
  const el = $('#typing'); if(!el) return;
  const n = state.aiBusy;
  if(!n.length){ el.innerHTML = ''; return; }
  const who = n.length === 1 ? 'permintaan ' + esc(n[0]) : n.length + ' permintaan';
  el.innerHTML = `<span class="dots"><i></i><i></i><i></i></span><span>AI sedang memproses ${who}...</span>`;
  const box = $('#msgs'); if(box && box.scrollHeight-box.scrollTop-box.clientHeight < 160) box.scrollTop = box.scrollHeight;
}
function postMsg(text){
  return push(ref(db,'messages'), { uid:me.uid, username:me.username, role:me.role, text, time:serverTimestamp() });
}
function refreshAiUI(){
  const b = $('#aiBtn'); if(!b) return;
  b.classList.toggle('on', aiMode);
  const h = $('#aiHint'); if(h) h.textContent = aiMode ? 'Mode AI aktif: pesan berikutnya dijawab AI di chat.' : '';
  const i = $('#inp'); if(i) i.placeholder = aiMode ? 'Tanya atau minta bantuan AI...' : 'Tulis pesan...';
}
async function askInChat(q){
  const ctx = state.msgs.slice(-9, -1).map(m => (m.role==='ai' ? 'AI' : m.username) + ': ' + String(m.text).slice(0, 200)).join('\n');
  const prompt = (ctx ? 'Percakapan terakhir di chat:\n' + ctx + '\n\n' : '') + 'Pertanyaan dari ' + me.username + ': ' + q;
  const busyRef = ref(db,'aiBusy/'+me.uid);
  try{
    onDisconnect(busyRef).remove().catch(()=>{});
    await set(busyRef, { username:me.username });
    const reply = await askAI([{ role:'user', content:prompt }]);
    await push(ref(db,'messages'), { uid:'ai', username:'AI', role:'ai', by:me.uid, text:reply.slice(0,4000), time:serverTimestamp() });
  }catch(e){
    toast(e && e.message && !e.code ? e.message : fbMsg(e));
  }finally{
    remove(busyRef).catch(()=>{});
  }
}

/* ================= HELP (chat biasa dengan AI) ================= */
const help = { hist:[], busy:false, loaded:false };
function loadHelp(){
  if(help.loaded) return; help.loaded = true;
  try{ help.hist = JSON.parse(ls.get('sr_help_'+me.uid) || '[]'); }catch(e){ help.hist = []; }
}
function saveHelp(){ ls.set('sr_help_'+me.uid, JSON.stringify(help.hist.slice(-30).map(m => ({ role:m.role, text:m.text })))); }
function drawHelp(force){
  const box = $('#hmsgs'); if(!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.innerHTML = help.hist.length
    ? help.hist.map(m => {
        const txt = m.shown !== undefined ? m.text.slice(0, m.shown) : m.text;
        return `<div class="msg ${m.role==='user'?'me':'ai'}">${m.role==='user'?'':'<div class="who"><span>✨ AI</span></div>'}<div>${fmtText(txt)}</div></div>`;
      }).join('')
    : empty('✨','Tanya apa saja ke AI.<br>Contoh: "Bagaimana cara request ke server?"');
  if(force || near) box.scrollTop = box.scrollHeight;
  const t = $('#htyping'); if(!t) return;
  const typing = help.hist.some(m => m.shown !== undefined);
  t.innerHTML = help.busy
    ? '<span class="dots"><i></i><i></i><i></i></span><span>AI sedang memproses...</span>'
    : typing ? '<span class="dots"><i></i><i></i><i></i></span><span>AI sedang mengetik...</span>' : '';
}
async function helpSend(text){
  if(help.busy) return;
  help.hist.push({ role:'user', text }); saveHelp();
  help.busy = true; drawHelp(true);
  try{
    const msgs = help.hist.slice(-12).map(m => ({ role: m.role==='user' ? 'user' : 'assistant', content: m.text }));
    const reply = await askAI(msgs);
    const m = { role:'ai', text:reply, shown:0 };
    help.hist.push(m); help.busy = false; saveHelp();
    const step = Math.max(4, Math.ceil(reply.length / 60));
    const timer = setInterval(() => {
      m.shown += step;
      if(m.shown >= m.text.length){ delete m.shown; clearInterval(timer); }
      if(current === 'help') drawHelp(true);
    }, 25);
  }catch(e){
    help.busy = false;
    help.hist.push({ role:'ai', text:'⚠️ ' + (e && e.message ? e.message : 'AI gagal menjawab.') });
    saveHelp();
  }
  if(current === 'help') drawHelp(true);
}

/* ================= VIEWS ================= */
const V = {};

V.dash = () => {
  if(me.role === 'admin'){
    view.innerHTML = `<div class="hero"><div class="big">🛡️</div><h2>Admin</h2><p>Service Request</p></div>`;
    return;
  }
  const s = myReq && myReq.status;
  if(s === 'accepted'){
    view.innerHTML = `<div class="hero"><div class="big">✅</div><h2>Request kamu diizinkan</h2><p>Administrator sudah mengizinkan pesan mu. Buka menu Chat untuk mulai.</p></div>`;
  }else if(s === 'denied'){
    view.innerHTML = `<div class="hero"><div class="big">❌</div><h2>Request kamu ditolak</h2><p>Administrator tidak mengizinkan pesan mu. Keluar lalu Request lagi jika perlu.</p></div>`;
  }else{
    view.innerHTML = `<div class="hero"><div class="big">⏳</div><h2>Kamu sedang Request ke server</h2><p>Harap tunggu Administrator mengizinkan pesan mu</p><div class="dots" style="margin-top:14px"><i></i><i></i><i></i></div></div>`;
  }
};

V.inbox = () => {
  const l = state.requests;
  if(!l.length){ view.innerHTML = empty('📥','Belum ada request masuk.'); return; }
  view.innerHTML = `<div class="list">${l.map(r => {
    const on = state.online.some(o => o.id === r.uid);
    const left = r.status === 'pending'
      ? `<div class="req-actions"><button class="btn ok" data-act="accepted" data-uid="${esc(r.uid)}">Accept</button><button class="btn danger" data-act="denied" data-uid="${esc(r.uid)}">Denied</button></div>`
      : `<span class="chip ${r.status==='accepted'?'ok':'no'}">${r.status==='accepted'?'Diterima':'Ditolak'}</span>`;
    return `<div class="card">${left}<div class="info"><b>${esc(r.username)}</b><span>${fmtTime(r.time)} • ${on?'online':'offline'}</span></div><span class="dot${on?'':' gray'}"></span></div>`;
  }).join('')}</div>`;
  view.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await update(ref(db,'requests/'+b.dataset.uid), { status:b.dataset.act }); }
    catch(e){ toast(fbMsg(e)); b.disabled = false; }
  });
};

V.chat = () => {
  if(!canChat()){
    const s = myReq && myReq.status;
    view.innerHTML = `<div class="hero"><div class="big">🔒</div><h2>${s==='denied'?'Request ditolak':'Chat belum dibuka'}</h2><p>${s==='denied'?'Administrator tidak mengizinkan pesan mu.':'Harap tunggu Administrator mengizinkan pesan mu.'}</p></div>`;
    return;
  }
  view.innerHTML = `<div class="chat-wrap">
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typing"></div>
    <div class="aibar"><button class="aibtn" id="aiBtn" type="button">✨ Bantuan AI</button><span class="hint" id="aiHint"></span></div>
    <div class="composer">
      <input type="text" id="inp" placeholder="Tulis pesan..." autocomplete="off" maxlength="1000">
      <button class="btn" id="send">Kirim</button>
    </div></div>`;
  const inp = $('#inp');
  const send = async () => {
    const v = inp.value.trim();
    const now = Date.now();
    if(!v || sendingChat || now - lastSend < 300) return;
    lastSend = now; sendingChat = true;
    inp.value = '';
    try{
      if(aiMode){
        aiMode = false; refreshAiUI();
        await postMsg('@AI ' + v);
        sendingChat = false;
        await askInChat(v);
      }else{
        await postMsg(v);
      }
    }catch(e){ toast(fbMsg(e)); inp.value = v; }
    sendingChat = false;
  };
  $('#send').onclick = send;
  inp.onkeydown = e => { if(e.key === 'Enter') send(); };
  $('#aiBtn').onclick = () => { aiMode = !aiMode; refreshAiUI(); if(aiMode) inp.focus(); };
  refreshAiUI(); drawMsgs(true); drawTyping();
};

V.help = () => {
  loadHelp();
  view.innerHTML = `<div class="chat-wrap">
    <div class="msgs" id="hmsgs"></div>
    <div class="typing" id="htyping"></div>
    <div class="composer">
      <button class="btn ghost" id="hclr" title="Hapus percakapan">🗑️</button>
      <input type="text" id="hinp" placeholder="Tanya AI..." autocomplete="off" maxlength="1000">
      <button class="btn" id="hsend">Kirim</button>
    </div></div>`;
  const inp = $('#hinp');
  const send = () => { const v = inp.value.trim(); if(!v || help.busy) return; inp.value = ''; helpSend(v); };
  $('#hsend').onclick = send;
  inp.onkeydown = e => { if(e.key === 'Enter') send(); };
  $('#hclr').onclick = () => { if(help.busy) return; help.hist = []; saveHelp(); drawHelp(true); };
  drawHelp(true);
};

V.online = () => {
  const l = state.online;
  view.innerHTML = `<h2 style="margin-top:0">${l.length} pengguna online</h2><div class="list">` +
    l.map(u => `<div class="card"><div class="av ${u.role==='admin'?'adm':'m'}">${esc((u.username||'?')[0].toUpperCase())}</div>
      <div class="info"><b>${esc(u.username)}${u.id===me.uid?' (kamu)':''}</b><span>${u.role==='admin'?'Admin':'Pengguna'}</span></div><span class="dot"></span></div>`).join('') + '</div>';
};

V.about = () => {
  view.innerHTML = `<div class="hero" style="margin-top:30px"><div class="big">🛎️</div><h2>Service Request</h2>
    <p>Aplikasi permintaan layanan. Pengguna mengirim request dengan username, lalu Administrator menerima atau menolaknya. Setelah diterima, pengguna bisa chat dan memakai bantuan AI.</p>
    <p style="margin-top:12px;font-size:13px">Versi 1.0</p></div>`;
};

V.settings = () => {
  view.innerHTML = `<div class="row"><span>Suara klik saat interaksi</span><input type="checkbox" id="snd" ${ls.get('sr_click')==='0'?'':'checked'} style="width:22px;height:22px"></div>`;
  $('#snd').onchange = e => { ls.set('sr_click', e.target.checked ? '1' : '0'); if(e.target.checked) clickSound(); };
};

/* ================= EVENT UMUM ================= */
$('#burger').onclick = () => document.body.classList.toggle('open');
$('#overlay').onclick = () => document.body.classList.remove('open');
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
</script>
